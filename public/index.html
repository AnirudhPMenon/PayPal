<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Duely</title>
  <link rel="icon" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/ag-grid-community@33/dist/ag-grid-community.min.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="wordmark" href="/" aria-label="Duely home">
      <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><rect width="22" height="22" rx="5" fill="#1E5A47"/><path d="M6.5 11.5l3 3 6-7" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Duely
    </a>
    <div class="topbar-right">
      <span class="env" id="env"></span>
      <span class="toolkit" id="toolkit"></span>
      <span class="business" id="business"></span>
    </div>
  </header>

  <main class="layout">
    <section class="ledger" aria-label="Your money">
      <div class="summary">
        <h1 id="headline">Loading your ledger</h1>
        <dl class="facts" id="facts"></dl>
      </div>

      <section class="block">
        <div class="block-head">
          <h2>Payment requests</h2>
          <input id="quickFilter" type="search" placeholder="Search clients or IDs" aria-label="Search payment requests" />
        </div>
        <div id="grid" class="grid"></div>
      </section>

      <section class="block" id="retainersBlock" hidden>
        <div class="block-head"><h2>Retainers</h2><span class="block-note">Recurring billing through PayPal Subscriptions</span></div>
        <table class="plain" id="retainers"></table>
      </section>

      <section class="block">
        <div class="block-head"><h2>Activity</h2></div>
        <ol class="activity" id="feed"></ol>
      </section>
    </section>

    <aside class="assistant" aria-label="Assistant">
      <div class="assistant-head">
        <div>
          <h2>Assistant</h2>
          <p class="sub" id="aiInfo">Bills, chases and pays through PayPal</p>
        </div>
        <button class="link-btn" id="resetBtn" type="button">Clear demo data</button>
      </div>
      <div class="log" id="messages" aria-live="polite"></div>
      <div class="composer-wrap">
        <div class="suggest" id="chips"></div>
        <form class="composer" id="composer">
          <label class="sr-only" for="input">Message the assistant</label>
          <textarea id="input" rows="2" placeholder="Bill Ravi $450 for 3 landing pages, due Friday"></textarea>
          <button type="submit" id="sendBtn">Send</button>
        </form>
      </div>
    </aside>
  </main>

  <div class="toasts" id="toasts" role="status"></div>
  <script src="/app.js"></script>
</body>
</html>
